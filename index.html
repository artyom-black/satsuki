<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>For you ♡</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: tender and playful, a little cheeky
   IDEA: a letter written across the night sky
   PICTURE: twinkling stars, falling sakura, light particles that become her name and a heart
   COLOUR and TYPE: deep indigo night, sakura pink, warm gold; Shippori Mincho + Zen Maru Gothic
   LAYOUT: one full-screen stage, centred lines, tap to advance */
:root{color-scheme:dark;--pink:#ff9cbf;--gold:#ffdca0}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0a0920;color:#fff6fa;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif}
.sky{position:fixed;inset:0;background:radial-gradient(130% 80% at 50% 115%,#4a1c4f 0%,#1d1340 45%,#0a0920 100%)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 24px) 28px calc(env(safe-area-inset-bottom) + 24px);text-align:center;pointer-events:none;transition:padding .8s}
#stage.low{justify-content:flex-end;padding-bottom:calc(env(safe-area-inset-bottom) + 96px)}
#stage.ask{padding-top:24vh}
#line{font-size:clamp(25px,6.8vw,42px);line-height:1.6;font-weight:500;letter-spacing:.05em;text-shadow:0 0 20px rgba(255,156,191,.5),0 0 2px rgba(255,255,255,.6)}
#line span{opacity:0;display:inline-block;transform:translateY(10px);filter:blur(6px);animation:in .8s forwards}
#line.done span{animation-delay:0s!important}
#line,#sub{transition:opacity .45s,transform .45s,filter .45s}
#line.out,#sub.out{opacity:0;transform:translateY(-16px) scale(.97);filter:blur(8px)}
#line.big{font-size:clamp(36px,11vw,62px);font-weight:700;color:#fff;text-shadow:0 0 18px #ff6f9f,0 0 50px rgba(255,111,159,.7)}
#line.big span{animation:pop .7s cubic-bezier(.3,1.8,.5,1) forwards}
@keyframes pop{from{opacity:0;transform:scale(.2) translateY(30px)}to{opacity:1;transform:none;filter:none}}
#flash{position:fixed;inset:0;background:radial-gradient(circle,#fff 0,#ffd1e0 40%,rgba(255,150,190,0) 75%);opacity:0;pointer-events:none;z-index:8}
#flash.go{animation:flash 1.2s ease-out}
@keyframes flash{0%{opacity:0}10%{opacity:.95}100%{opacity:0}}
@keyframes in{to{opacity:1;transform:none;filter:none}}
#sub{margin-top:16px;font:500 15px/1.7 "Zen Maru Gothic",sans-serif;color:var(--gold);min-height:1.7em;transition:opacity .4s}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 26px);text-align:center;font:500 13px "Zen Maru Gothic",sans-serif;letter-spacing:.2em;color:rgba(255,246,250,.5);opacity:0;transition:opacity .6s;pointer-events:none}
#hint.on{opacity:1;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.btns{margin-top:36px;display:flex;gap:18px;align-items:center;justify-content:center;pointer-events:auto;opacity:0;animation:in .8s 1.2s forwards}
button{font:700 18px "Zen Maru Gothic",sans-serif;padding:14px 32px;min-height:54px;border-radius:999px;border:0;cursor:pointer;touch-action:manipulation}
#yes{background:linear-gradient(135deg,#ffb3cd,#ff6f9f);color:#3a0b22;transition:transform .45s cubic-bezier(.3,1.6,.5,1);animation:glow 1.8s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 8px 28px rgba(255,111,159,.45),0 0 0 0 rgba(255,156,191,.6)}50%{box-shadow:0 10px 44px rgba(255,111,159,.8),0 0 0 14px rgba(255,156,191,0)}}
#no{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.35);transition:left .35s cubic-bezier(.5,1.6,.5,1),top .35s cubic-bezier(.5,1.6,.5,1),opacity .4s,transform .4s;z-index:5}
#no.shake{animation:shake .32s}
@keyframes shake{20%{translate:-9px 0;rotate:-8deg}40%{translate:8px 0;rotate:7deg}60%{translate:-6px 0;rotate:-4deg}80%{translate:4px 0}}
#no.bye{opacity:0!important;transform:scale(.1) rotate(40deg)!important;pointer-events:none}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;cursor:pointer;transition:opacity 1.2s,transform 1.2s;z-index:10}
#intro.gone{opacity:0;transform:scale(1.6);pointer-events:none}
.orb{width:96px;height:96px;border-radius:50%;position:relative;background:radial-gradient(circle,#fff 0,#ffd1e0 22%,rgba(255,111,159,.35) 48%,rgba(255,111,159,0) 70%);animation:beat 1.6s ease-in-out infinite}
.orb::after,.orb::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(255,190,214,.7);animation:ring 2.4s ease-out infinite}
.orb::before{animation-delay:1.2s}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(.98)}45%{transform:scale(1.07)}}
@keyframes ring{from{transform:scale(.7);opacity:1}to{transform:scale(2.4);opacity:0}}
.t1{font-size:26px;letter-spacing:.2em;font-weight:700}
.t2{font:500 13px/1.8 "Zen Maru Gothic",sans-serif;color:rgba(255,246,250,.65);text-align:center}
#mute{position:fixed;top:calc(env(safe-area-inset-top) + 14px);right:14px;width:44px;height:44px;padding:0;min-height:0;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:18px;display:none;z-index:6}
#mute.off{opacity:.45;text-decoration:line-through}
@media (prefers-reduced-motion:reduce){.orb,.orb::after,.orb::before,#hint.on{animation:none}}
</style>
</head>
<body>
<div class="sky"></div>
<canvas id="c"></canvas>
<div id="stage"><div id="line"></div><div id="sub"></div><div id="ask"></div></div>
<div id="hint">タップして次へ</div>
<div id="flash"></div>
<button id="mute" aria-label="音楽オン・オフ">♪</button>
<div id="intro">
  <div class="orb"></div>
  <p class="t1">タップしてね</p>
  <p class="t2">🎧 音を出して見てね<br>（マナーモードはオフで）</p>
</div>
<script>
{
/* ========= ここだけ書き換えればOK / EDIT THESE ========= */
const CONFIG = {
  her: "さつき",      // her name (as you call her)
  me:  "アルチョム",  // your name
  music: "song.mp3"   // song file next to this page. Empty = built-in music box melody
};
/* ======================================================= */
const H = CONFIG.her, ME = CONFIG.me;
const SCENES = [
  {say:`こんばんは、${H}。`},
  {say:`このページは\n${H}のためだけに\n作りました。`},
  {say:`世界にひとつだけ。\nたぶん、けっこう本気。`},
  {say:`指で画面を\nなぞってみて`, sub:"✨ ゆっくりでいいよ", draw:true},
  {say:`…ほら。`, shape:"name"},
  {say:`${H}と話してると\n時間があっという間に\n過ぎちゃう。`},
  {say:`笑ってる顔を見ると\nこっちまで\n嬉しくなる。`},
  {say:`気づいたら毎日\n${H}のこと\n考えてた。`},
  {say:`だから\nちゃんと言わせてください。`, shape:"heart"},
  {say:`${H}、\n僕の彼女に\nなってくれませんか？`, ask:true, shape:"heartS"}
];
const NO_MSGS = ["え？😳","押せないよ〜😜","もう一回考えてみて？","「いいえ」は品切れです🙏","…あ、いいえが逃げちゃった👋 答えはひとつだね💗"];

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $line = document.getElementById('line'), $sub = document.getElementById('sub'),
      $ask = document.getElementById('ask'), $hint = document.getElementById('hint'),
      $stage = document.getElementById('stage'), $intro = document.getElementById('intro'),
      $mute = document.getElementById('mute');
let W = 0, Hh = 0, DPR = 1, px = 0, py = 0, ptr = null;

/* ---------- world ---------- */
let stars = [], petals = [], parts = [], sparks = [], shoot = null, shapeKind = null, petalRate = 1;
function rnd(a, b){ return a + Math.random() * (b - a); }
function resize(){
  W = innerWidth; Hh = innerHeight; DPR = Math.min(devicePixelRatio || 1, 2);
  cv.width = W * DPR; cv.height = Hh * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  stars = Array.from({length: Math.round(W * Hh / 2600)}, () => ({x: rnd(0, W), y: rnd(0, Hh), r: rnd(.3, 1.4), p: rnd(0, 6.3), d: rnd(.2, 1)}));
  if (!parts.length){
    const N = Math.min(1100, Math.max(520, Math.round(W * Hh / 520)));
    parts = Array.from({length: N}, () => ({x: rnd(0, W), y: rnd(0, Hh), vx: 0, vy: 0, tx: 0, ty: 0, has: false,
      s: rnd(.8, 2.2), c: Math.random() < .7 ? [255, 170, 200] : (Math.random() < .5 ? [255, 222, 160] : [255, 255, 255]), a: rnd(.2, .5)}));
  }
  if (shapeKind) setShape(shapeKind);
}
function newPetal(top){ return {x: rnd(-20, W + 20), y: top ? rnd(-Hh, 0) : rnd(0, Hh), s: rnd(5, 10), r: rnd(0, 6.3), vr: rnd(-.03, .03), vy: rnd(.4, 1.1), sw: rnd(0, 6.3), sws: rnd(.01, .03), fl: rnd(0, 6.3)}; }

function sample(kind){
  const o = document.createElement('canvas'); o.width = W; o.height = Hh;
  const g = o.getContext('2d'); g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  if (kind === 'heart' || kind === 'heartS'){
    const big = kind === 'heart', r = Math.min(W, Hh) * (big ? .026 : .013), cy = Hh * (big ? .37 : .16);
    g.beginPath();
    for (let t = 0; t < 6.3; t += .02){
      const x = 16 * Math.sin(t) ** 3, y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      g.lineTo(W / 2 + x * r, cy + y * r);
    }
    g.fill();
  } else {
    const txt = kind === 'name' ? H : `${H} ♡ ${ME}`, cy = Hh * (kind === 'name' ? .36 : .2);
    let fs = Math.min(Hh * .2, 220);
    do { g.font = `700 ${fs}px "Shippori Mincho","Hiragino Mincho ProN",serif`; fs -= 4; } while (g.measureText(txt).width > W * .86 && fs > 20);
    g.fillText(txt, W / 2, cy);
  }
  const d = g.getImageData(0, 0, W, Hh).data;
  const grab = st => { const p = []; for (let y = 0; y < Hh; y += st) for (let x = 0; x < W; x += st) if (d[(y * W + x) * 4 + 3] > 128) p.push([x, y]); return p; };
  let pts = grab(2);
  const st = Math.max(2, Math.round(2 * Math.sqrt(pts.length / parts.length)));
  pts = grab(st);
  for (let i = pts.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [pts[i], pts[j]] = [pts[j], pts[i]]; }
  return pts;
}
function setShape(kind){
  shapeKind = kind;
  if (!kind){ parts.forEach(p => { p.has = false; p.vx += rnd(-3, 3); p.vy += rnd(-3, 3); }); return; }
  const pts = sample(kind);
  parts.forEach((p, i) => { if (i < pts.length){ p.has = true; p.tx = pts[i][0] + rnd(-.8, .8); p.ty = pts[i][1] + rnd(-.8, .8); } else p.has = false; });
}
function burst(x, y, n = 70, hue){
  const cols = [[255, 156, 191], [255, 220, 160], [190, 170, 255], [255, 255, 255]];
  const c = hue || cols[Math.random() * cols.length | 0];
  for (let i = 0; i < n; i++){
    const a = Math.random() * 6.283, v = rnd(1, 5.5);
    sparks.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, l: 1, dl: rnd(.008, .018), c, g: .045});
  }
}

function heartBurst(x, y, sc = 1){
  const c = Math.random() < .5 ? [255, 140, 185] : [255, 200, 220];
  for (let t = 0; t < 6.283; t += .09){
    const hx = 16 * Math.sin(t) ** 3, hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
    sparks.push({x, y, vx: hx * .28 * sc, vy: hy * .28 * sc, l: 1, dl: .011, c, g: .012});
  }
  burst(x, y, 20, [255, 255, 255]);
}
let conf = [], warp = 0;
function confetti(n){
  const cols = ['#ff9cbf', '#ffdca0', '#ffffff', '#c9b8ff', '#ff6f9f', '#9fe3ff'];
  for (let i = 0; i < n; i++) conf.push({x: rnd(0, W), y: rnd(-Hh * .6, -10), vx: rnd(-1, 1), vy: rnd(1.5, 4), r: rnd(0, 6.3), vr: rnd(-.15, .15), s: rnd(5, 10), c: cols[Math.random() * cols.length | 0], h: Math.random() < .35, fl: rnd(0, 6.3)});
}
function heartPath(g, s){
  g.beginPath(); g.moveTo(0, s * .3);
  g.bezierCurveTo(-s, -s * .4, -s * .45, -s * 1.1, 0, -s * .45);
  g.bezierCurveTo(s * .45, -s * 1.1, s, -s * .4, 0, s * .3); g.fill();
}

/* ---------- render loop ---------- */
let T = 0;
function frame(){
  T++;
  ctx.clearRect(0, 0, W, Hh);
  const ox = px * 12, oy = py * 12;
  if (warp > .01){
    warp *= .965;
    const cx = W / 2, cy = Hh / 2;
    ctx.lineCap = 'round';
    for (const s of stars){
      const dx = s.x - cx, dy = s.y - cy, k1 = 1 + warp * .9, k2 = 1 + warp * .15;
      ctx.strokeStyle = `rgba(255,${220 + s.d * 30 | 0},240,${Math.min(1, warp * 1.5) * s.d})`;
      ctx.lineWidth = s.r * 1.4;
      ctx.beginPath(); ctx.moveTo(cx + dx * k2, cy + dy * k2); ctx.lineTo(cx + dx * k1, cy + dy * k1); ctx.stroke();
    }
  }
  for (const s of stars){
    const tw = .55 + .45 * Math.sin(T * .03 + s.p);
    ctx.fillStyle = `rgba(255,248,240,${tw * s.d * (1 - Math.min(1, warp))})`;
    ctx.fillRect(s.x + ox * s.d, s.y + oy * s.d, s.r, s.r);
  }
  if (!shoot && Math.random() < .004) shoot = {x: rnd(W * .2, W), y: rnd(0, Hh * .4), l: 1};
  if (shoot){
    const g = ctx.createLinearGradient(shoot.x, shoot.y, shoot.x + 90, shoot.y - 40);
    g.addColorStop(0, `rgba(255,255,255,${shoot.l})`); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = g; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(shoot.x, shoot.y); ctx.lineTo(shoot.x + 90, shoot.y - 40); ctx.stroke();
    shoot.x -= 9; shoot.y += 4; shoot.l -= .02; if (shoot.l <= 0) shoot = null;
  }
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts){
    if (p.has){
      p.vx = (p.vx + (p.tx - p.x) * .018) * .86; p.vy = (p.vy + (p.ty - p.y) * .018) * .86;
    } else {
      p.vx = p.vx * .97 + Math.sin(T * .01 + p.y * .01) * .02; p.vy = p.vy * .97 + Math.cos(T * .01 + p.x * .01) * .02 - .004;
      if (ptr && drawing){ const dx = ptr.x - p.x, dy = ptr.y - p.y, d2 = dx * dx + dy * dy; if (d2 < 30000){ p.vx += dx * .0009; p.vy += dy * .0009; } }
      if (p.x < -10) p.x = W + 10; if (p.x > W + 10) p.x = -10; if (p.y < -10) p.y = Hh + 10; if (p.y > Hh + 10) p.y = -10;
    }
    p.x += p.vx; p.y += p.vy;
    const al = p.has ? (shapeKind === 'heartS' ? .55 : .9) : p.a * .6, tw = .75 + .25 * Math.sin(T * .08 + p.s * 9);
    ctx.fillStyle = `rgba(${p.c[0]},${p.c[1]},${p.c[2]},${al * .18 * tw})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.s * 3, 0, 6.283); ctx.fill();
    ctx.fillStyle = `rgba(${p.c[0]},${p.c[1]},${p.c[2]},${al * tw})`;
    ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
  }
  for (let i = sparks.length - 1; i >= 0; i--){
    const s = sparks[i]; s.vx *= .985; s.vy = s.vy * .985 + s.g; s.x += s.vx; s.y += s.vy; s.l -= s.dl;
    if (s.l <= 0){ sparks.splice(i, 1); continue; }
    ctx.fillStyle = `rgba(${s.c[0]},${s.c[1]},${s.c[2]},${s.l})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, 1.6 * s.l + .4, 0, 6.283); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  for (let i = conf.length - 1; i >= 0; i--){
    const c = conf[i]; c.vy = Math.min(c.vy + .03, 4.5); c.x += c.vx + Math.sin(c.fl) * .6; c.y += c.vy; c.r += c.vr; c.fl += .06;
    if (c.y > Hh + 20){ conf.splice(i, 1); continue; }
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r); ctx.fillStyle = c.c;
    if (c.h) heartPath(ctx, c.s); else { ctx.scale(1, Math.cos(c.fl)); ctx.fillRect(-c.s / 2, -c.s / 4, c.s, c.s / 2); }
    ctx.restore();
  }
  while (petals.length < 22 * petalRate) petals.push(newPetal(true));
  for (let i = petals.length - 1; i >= 0; i--){
    const p = petals[i]; p.sw += p.sws; p.y += p.vy; p.x += Math.sin(p.sw) * .8 + .25; p.r += p.vr; p.fl += .05;
    if (p.y > Hh + 20){ if (petals.length > 22 * petalRate) petals.splice(i, 1); else Object.assign(p, newPetal(true), {y: -20}); continue; }
    ctx.save(); ctx.translate(p.x + ox * .5, p.y + oy * .5); ctx.rotate(p.r); ctx.scale(1, Math.abs(Math.cos(p.fl)) * .7 + .3);
    ctx.fillStyle = 'rgba(255,183,207,.85)';
    ctx.beginPath(); ctx.moveTo(0, -p.s);
    ctx.quadraticCurveTo(p.s, -p.s * .3, 0, p.s); ctx.quadraticCurveTo(-p.s, -p.s * .3, 0, -p.s); ctx.fill();
    ctx.restore();
  }
  requestAnimationFrame(frame);
}

/* ---------- music ---------- */
let AC = null, master = null, bus = null, synthOn = false, au = null, muted = false;
function initAC(){
  if (AC) return;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0; master.connect(AC.destination);
  bus = AC.createGain(); bus.connect(master);
  const dl = AC.createDelay(), fb = AC.createGain(), wet = AC.createGain();
  dl.delayTime.value = .36; fb.gain.value = .38; wet.gain.value = .32;
  bus.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(master);
}
const mf = m => 440 * Math.pow(2, (m - 69) / 12);
function bell(m, t, v){
  [[1, 1, 2.4], [2.005, .3, 1.2], [3.99, .1, .5]].forEach(([mul, amp, dec]) => {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = mf(m) * mul;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v * amp, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + dec);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t + dec + .05);
  });
}
const CH = [[60, 64, 67], [55, 59, 62], [57, 60, 64], [53, 57, 60]];
const MEL = [[76, 79, 76, 74], [74, 71, 74, 79], [72, 76, 81, 79], [77, 76, 72, 74]];
const ARP = [0, 1, 2, 3, 4, 2, 3, 1];
function startSynth(){
  initAC(); AC.resume(); if (synthOn) return; synthOn = true;
  master.gain.setValueAtTime(0, AC.currentTime); master.gain.linearRampToValueAtTime(muted ? 0 : .55, AC.currentTime + 2.5);
  const E = 60 / 72 / 2; let nt = AC.currentTime + .1, st = 0;
  setInterval(() => {
    while (nt < AC.currentTime + .25){
      const bar = (st >> 3) % 4, b = st % 8, c = CH[bar], loop = st >> 5;
      const pool = [c[0], c[1], c[2], c[0] + 12, c[1] + 12];
      bell(pool[ARP[b]] + 12, nt, .07);
      if (b === 0) bell(c[0] - 12, nt, .11);
      if (loop % 2 === 1 && b % 2 === 0) bell(MEL[bar][b >> 1] + 12, nt, .1);
      nt += E; st++;
    }
  }, 60);
}
let musicFailed = false;
if (CONFIG.music){
  au = new Audio(); au.preload = 'auto'; au.loop = true; au.setAttribute('playsinline', '');
  au.addEventListener('error', () => { musicFailed = true; if (started) startSynth(); });
  au.src = CONFIG.music; au.load();
}
function startMusic(){
  if (au && !musicFailed){
    const pr = au.play(); if (pr && pr.catch) pr.catch(startSynth);
  } else startSynth();
}
$mute.addEventListener('click', e => {
  e.stopPropagation(); muted = !muted; $mute.classList.toggle('off', muted);
  if (au) au.muted = muted;
  if (master) master.gain.setTargetAtTime(muted ? 0 : .55, AC.currentTime, .2);
});

/* ---------- story ---------- */
let idx = -1, typingUntil = 0, drawing = false, drawDist = 0, drawStart = 0, started = false, answered = false;
function swap(text, sub, cls){
  $line.classList.add('out'); $sub.classList.add('out');
  typingUntil = performance.now() + 5000;
  setTimeout(() => { type(text, sub, cls); $sub.classList.remove('out'); }, 450);
}
function type(text, sub, cls){
  $line.className = cls || '';
  let i = 0;
  $line.innerHTML = text.split('').map(ch => ch === '\n' ? '<br>' : `<span style="animation-delay:${(i++) * 70}ms">${ch === ' ' ? '&nbsp;' : ch}</span>`).join('');
  typingUntil = performance.now() + i * 70 + 700;
  $sub.textContent = sub || '';
}
function go(i){
  idx = i; const s = SCENES[i]; if (!s) return;
  $hint.classList.remove('on');
  $stage.className = s.ask ? 'ask' : (s.shape ? 'low' : '');
  setShape(s.shape || null);
  $ask.innerHTML = '';
  drawing = false;
  const first = i === 0;
  (first ? type : swap)(s.say, s.sub);
  setTimeout(() => {
    if (idx !== i) return;
    drawing = !!s.draw; drawDist = 0; drawStart = performance.now();
    if (s.ask) buildAsk();
    else if (!s.draw) setTimeout(() => { if (idx === i) $hint.classList.add('on'); }, typingUntil - performance.now() + 300);
  }, first ? 0 : 470);
}
function next(){
  const s = SCENES[idx]; if (!s || s.ask) return;
  if (performance.now() < typingUntil){ $line.classList.add('done'); typingUntil = 0; if (!s.draw) $hint.classList.add('on'); return; }
  if (s.draw && performance.now() - drawStart < 9000) return;
  go(idx + 1);
}
function buildAsk(){
  $ask.innerHTML = '<div class="btns"><button id="yes">はい 💗</button><button id="no">いいえ</button></div>';
  const yes = document.getElementById('yes'), no = document.getElementById('no');
  let n = 0, busy = false;
  const dodge = e => {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    if (busy || n >= NO_MSGS.length) return;
    busy = true;
    const r = no.getBoundingClientRect();
    if (no.style.position !== 'fixed'){ no.style.position = 'fixed'; no.style.left = r.left + 'px'; no.style.top = r.top + 'px'; }
    no.classList.remove('shake'); void no.offsetWidth; no.classList.add('shake');
    for (let q = 0; q < 10; q++) sparks.push({x: r.left + r.width / 2, y: r.top + r.height / 2, vx: rnd(-2, 2), vy: rnd(-2, 2), l: .8, dl: .03, c: [255, 255, 255], g: .02});
    $sub.textContent = NO_MSGS[n]; n++;
    yes.style.transform = `scale(${1 + n * .15})`;
    if (n >= NO_MSGS.length){
      no.classList.add('bye'); busy = false;
      setTimeout(() => { no.remove(); burst(r.left + r.width / 2, r.top + r.height / 2, 40, [200, 200, 255]); }, 420);
      return;
    }
    setTimeout(() => {
      const m = 20, maxX = W - r.width - m, maxY = Hh - r.height - m - 40;
      let x, y, tries = 0;
      do { x = rnd(m, maxX); y = rnd(m + 60, maxY); tries++; } while (tries < 20 && Math.hypot(x - r.left, y - r.top) < 150);
      no.style.left = x + 'px'; no.style.top = y + 'px';
      no.style.opacity = String(1 - n * .16); no.style.transform = `scale(${1 - n * .1})`;
      setTimeout(() => { busy = false; }, 300);
    }, 220);
  };
  no.addEventListener('pointerdown', dodge);
  no.addEventListener('mouseenter', dodge);
  no.addEventListener('click', e => { if (n < NO_MSGS.length) dodge(e); });
  yes.addEventListener('click', say);
}
function say(e){
  if (e) e.stopPropagation();
  if (answered) return; answered = true;
  const f = document.getElementById('flash'); f.classList.add('go');
  if (navigator.vibrate) try { navigator.vibrate([60, 40, 120]); } catch (er) {}
  $ask.innerHTML = ''; $hint.classList.remove('on');
  $stage.className = 'low'; petalRate = 3; warp = .6;
  parts.forEach(p => { const a = Math.random() * 6.283, v = rnd(4, 14); p.vx = Math.cos(a) * v; p.vy = Math.sin(a) * v; p.has = false; });
  setTimeout(() => setShape('couple'), 900);
  confetti(160);
  heartBurst(W / 2, Hh * .4, 1.4);
  type('やったー！！', '', 'big');
  for (let q = 0; q < 6; q++) setTimeout(() => (q % 2 ? heartBurst : burst)(rnd(W * .15, W * .85), rnd(Hh * .12, Hh * .55), 1), 300 + q * 280);
  let k = 0;
  const fw = setInterval(() => { (k % 3 === 0 ? heartBurst : burst)(rnd(W * .1, W * .9), rnd(Hh * .1, Hh * .5), .9); if (k % 5 === 0) confetti(40); if (++k > 40) clearInterval(fw); }, 700);
  setTimeout(() => swap('ありがとう。\nこれから、よろしくね。', `— ${ME}`), 3800);
  setTimeout(() => swap(`${H}のこと、\nずっと大切にします。`, `${H} ♡ ${ME}`), 9500);
  setTimeout(() => { setInterval(() => (Math.random() < .4 ? heartBurst : burst)(rnd(W * .1, W * .9), rnd(Hh * .1, Hh * .45), .7), 2400); }, 32000);
}

/* ---------- input ---------- */
addEventListener('pointermove', e => {
  px = e.clientX / W - .5; py = e.clientY / Hh - .5;
  const last = ptr; ptr = {x: e.clientX, y: e.clientY};
  if (drawing && last){
    const d = Math.hypot(ptr.x - last.x, ptr.y - last.y); drawDist += d;
    if (Math.random() < .7) sparks.push({x: ptr.x, y: ptr.y, vx: rnd(-1, 1), vy: rnd(-1, 1), l: 1, dl: .02, c: Math.random() < .5 ? [255, 170, 200] : [255, 225, 170], g: .01});
    if (drawDist > Math.max(1400, (W + Hh) * 1.3)){ drawing = false; burst(ptr.x, ptr.y, 60); go(idx + 1); }
  }
}, {passive: true});
addEventListener('pointerdown', e => { ptr = {x: e.clientX, y: e.clientY}; });
addEventListener('pointerup', e => {
  if (!started || e.target.closest('button')) return;
  if (!drawing) burst(e.clientX, e.clientY, 18, [255, 200, 220]);
  next();
});
$intro.addEventListener('click', () => {
  if (started) return; started = true;
  startMusic();
  $intro.classList.add('gone'); $mute.style.display = 'block';
  warp = 1.2;
  burst(W / 2, Hh / 2, 120, [255, 190, 214]);
  setTimeout(() => heartBurst(W / 2, Hh / 2, .8), 500);
  setTimeout(() => go(0), 1500);
});
addEventListener('resize', resize);
resize();
for (let i = 0; i < 22; i++) petals.push(newPetal(false));
requestAnimationFrame(frame);
}
</script>
